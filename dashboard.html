<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Next Over — Live Prediction</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --pitch-dark: #0b1410;
    --pitch-panel: #10241a;
    --pitch-line: #1e3d2b;
    --led-amber: #ffb238;
    --led-white: #f4f7f2;
    --wicket-red: #e0473b;
    --safe-green: #4caf6d;
    --muted: #6f8c7c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--pitch-dark);
    background-image:
      radial-gradient(circle at 50% 0%, rgba(76,175,109,0.08), transparent 60%);
    color: var(--led-white);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .board {
    width: 100%;
    max-width: 720px;
    background: var(--pitch-panel);
    border: 1px solid var(--pitch-line);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.5);
  }

  .board-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    border-bottom: 1px solid var(--pitch-line);
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }

  .board-header .label {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--wicket-red);
    margin-right: 8px;
    animation: pulse 1.6s infinite ease-in-out;
    vertical-align: middle;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .matchup {
    padding: 28px 24px 8px;
    text-align: center;
  }

  .matchup .over-num {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--led-amber);
    text-transform: uppercase;
  }

  .matchup .names {
    font-size: 28px;
    font-weight: 600;
    margin-top: 8px;
    line-height: 1.3;
  }

  .matchup .names .vs {
    color: var(--muted);
    font-weight: 400;
    font-size: 20px;
    margin: 0 8px;
  }

  .situation {
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    padding-bottom: 20px;
  }

  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-top: 1px solid var(--pitch-line);
    border-bottom: 1px solid var(--pitch-line);
  }

  .metric {
    padding: 24px;
    text-align: center;
  }

  .metric:first-child {
    border-right: 1px solid var(--pitch-line);
  }

  .metric .metric-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .metric .metric-value {
    font-family: 'DM Mono', monospace;
    font-size: 46px;
    font-weight: 500;
    line-height: 1;
    color: var(--led-amber);
  }

  .metric .metric-value.wicket-high { color: var(--wicket-red); }
  .metric .metric-value.wicket-low { color: var(--safe-green); }

  .metric .metric-sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }

  .insights {
    padding: 20px 24px 24px;
  }

  .insights .insights-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .insight-line {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    font-size: 15px;
    line-height: 1.5;
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  .insight-line:first-of-type { border-top: none; }

  .insight-line .marker {
    color: var(--led-amber);
    flex-shrink: 0;
  }

  .updated {
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    padding: 12px;
    border-top: 1px solid var(--pitch-line);
  }

  .error-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
  }

  .confidence-flag {
    margin: 0 24px 20px;
    padding: 12px 16px;
    background: rgba(224, 71, 59, 0.12);
    border: 1px solid rgba(224, 71, 59, 0.35);
    border-radius: 3px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #f4a89f;
  }

  .confidence-flag .flag-icon {
    font-size: 15px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="board" id="board">
  <div class="error-state">Waiting for prediction data…</div>
</div>

<script>
async function refresh() {
  try {
    const res = await fetch('live_prediction.json?_=' + Date.now());
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('board').innerHTML =
      '<div class="error-state">No prediction data yet.<br>Run live_feed.py (--mock or --live) in another Terminal tab.</div>';
  }
}

function wicketClass(prob) {
  if (prob >= 35) return 'wicket-high';
  if (prob <= 12) return 'wicket-low';
  return '';
}

function render(data) {
  const p = data.prediction;
  const wClass = wicketClass(p.wicket_probability);

  const insightsHtml = p.commentary_lines.map(line =>
    `<div class="insight-line"><span class="marker">▸</span><span>${line}</span></div>`
  ).join('');

  const conf = p.data_confidence;
  const confidenceHtml = (conf && conf.limited_data)
    ? `<div class="confidence-flag"><span class="flag-icon">⚠</span><span>${conf.note}</span></div>`
    : '';

  document.getElementById('board').innerHTML = `
    <div class="board-header">
      <span class="label"><span class="live-dot"></span>Next Over</span>
      <span class="label">Over ${data.over}</span>
    </div>
    <div class="matchup">
      <div class="over-num">Facing</div>
      <div class="names">${data.batsman}<span class="vs">vs</span>${data.bowler}</div>
    </div>
    <div class="situation">Score ${data.score_before_over}/${data.wickets_down} before this over</div>
    ${confidenceHtml}
    <div class="metrics">
      <div class="metric">
        <div class="metric-label">Expected Runs</div>
        <div class="metric-value">${p.expected_runs}</div>
        <div class="metric-sub">range ${p.expected_range}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Wicket Chance</div>
        <div class="metric-value ${wClass}">${p.wicket_probability}%</div>
        <div class="metric-sub">this over</div>
      </div>
    </div>
    <div class="insights">
      <div class="insights-label">Commentary Insights</div>
      ${insightsHtml}
    </div>
    <div class="updated">Auto-refreshing every 4s · Last checked ${new Date().toLocaleTimeString()}</div>
  `;
}

refresh();
setInterval(refresh, 4000);
</script>

</body>
</html>
